services:
  api:
    environment:
      APP_ENV: production
      OBJECT_STORAGE_BACKEND: s3
      S3_BUCKET: pitstop-private
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_PREFIX: ${S3_PREFIX:-pitstop}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
  web:
    ports:
      - "${STAGING_WEB_PORT:-8080}:80"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
  postgres:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
  redis:
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
