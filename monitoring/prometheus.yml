global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: eurogrip-pitstop-api
    metrics_path: /internal/metrics
    static_configs:
      - targets: ["api:8000"]
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics_token
