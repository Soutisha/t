x-default-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pitstop
      POSTGRES_USER: pitstop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U pitstop -d pitstop"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    logging: *default-logging
    image: redis:7-alpine
    command: ["redis-server","--appendonly","yes","--requirepass","${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD}","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    logging: *default-logging
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: ["minio_data:/data"]
    # Keep the object-store console private; administer through a secure tunnel.
  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "/scripts/minio-bootstrap.sh"]
    volumes:
      - ./scripts/minio-bootstrap.sh:/scripts/minio-bootstrap.sh:ro
      - ./minio/policies:/policies:ro
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_APP_USER: ${MINIO_APP_USER:?Set MINIO_APP_USER in .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?Set MINIO_APP_PASSWORD in .env}
  api:
    logging: *default-logging
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://pitstop:${POSTGRES_PASSWORD}@postgres:5432/pitstop
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_FINGERPRINT_SECRET: ${CLIENT_FINGERPRINT_SECRET:?Set CLIENT_FINGERPRINT_SECRET in .env}
      METRICS_TOKEN: ${METRICS_TOKEN:?Set METRICS_TOKEN in .env}
      OTP_DEV_RETURN_CODE: "false"
      SMS_PROVIDER: ${SMS_PROVIDER:?Set SMS_PROVIDER=twilio in .env}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:?Set TWILIO_ACCOUNT_SID in .env}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:?Set TWILIO_AUTH_TOKEN in .env}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:?Set TWILIO_FROM_NUMBER in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in .env}
      OBJECT_STORAGE_BACKEND: s3
      S3_BUCKET: pitstop-private
      S3_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
      S3_SERVER_SIDE_ENCRYPTION: ${S3_SERVER_SIDE_ENCRYPTION:-}
      TRUSTVISION_STORAGE_DIR: /app/var/trustvision
      OBJECT_STORAGE_LOCAL_DIR: /app/var/trustvision
      S3_ACCESS_KEY_ID: ${MINIO_APP_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_APP_PASSWORD}
    expose: ["8000"]
    volumes: ["trustvision_data:/app/var/trustvision"]
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  web:
    logging: *default-logging
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
  prometheus:
    logging: *default-logging
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics_token:/etc/prometheus/secrets/metrics_token:ro
      - prometheus_data:/prometheus
    expose: ["9090"]
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
  # A provider-specific worker is intentionally not enabled until an ERP/webhook
  # adapter and its credentials have been configured and tested.
volumes:
  postgres_data:
  redis_data:
  minio_data:
  trustvision_data:
  prometheus_data:
