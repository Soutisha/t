# EUROGRIP PITSTOP OS — zero-cost Render web tier with external free PostgreSQL.
# Render's free database and Redis quota is already used by another project.
services:
  - type: web
    name: eurogrip-pitstop-os
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: EUROGRIP PITSTOP OS API
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_FINGERPRINT_SECRET
        generateValue: true
      - key: OTP_DEV_RETURN_CODE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      - key: SMS_PROVIDER
        value: none
      - key: OBJECT_STORAGE_BACKEND
        value: local
      - key: TRUSTVISION_STORAGE_DIR
        value: /app/var/trustvision
      - key: OBJECT_STORAGE_LOCAL_DIR
        value: /app/var/objects
      - key: RAG_EMBEDDING_PROVIDER
        value: hashing
      - key: AUDIT_LOG_ENABLED
        value: "true"
