# EUROGRIP PITSTOP OS — single-origin Render deployment.
# This Blueprint creates only new, separately named resources.
services:
  - type: keyvalue
    name: eurogrip-pitstop-redis
    region: singapore
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: eurogrip-pitstop-os
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: EUROGRIP PITSTOP OS API
      - key: DATABASE_URL
        fromDatabase:
          name: eurogrip-pitstop-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: eurogrip-pitstop-redis
          type: keyvalue
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_FINGERPRINT_SECRET
        generateValue: true
      - key: METRICS_TOKEN
        generateValue: true
      - key: OTP_DEV_RETURN_CODE
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      - key: SMS_PROVIDER
        value: none
      - key: OBJECT_STORAGE_BACKEND
        value: local
      - key: TRUSTVISION_STORAGE_DIR
        value: /app/var/trustvision
      - key: OBJECT_STORAGE_LOCAL_DIR
        value: /app/var/objects
      - key: RAG_EMBEDDING_PROVIDER
        value: hashing
      - key: AUDIT_LOG_ENABLED
        value: "true"
databases:
  - name: eurogrip-pitstop-db
    region: singapore
    plan: free
    databaseName: pitstop
    user: pitstop
    postgresMajorVersion: 16
