name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: sqlite:///./ci_test.db
      JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
      CLIENT_FINGERPRINT_SECRET: ci-only-fingerprint-secret-1234567890
      OTP_DEV_RETURN_CODE: "true"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-cloud.txt
      - run: python -m compileall -q app tests scripts
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: eurogrip-pitstop-api:ci
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: eurogrip-pitstop-web:ci


  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pitstop_ci
          POSTGRES_USER: pitstop
          POSTGRES_PASSWORD: pitstop-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pitstop -d pitstop_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://pitstop:pitstop-ci-password@localhost:5432/pitstop_ci
      JWT_SECRET: ci-only-secret-that-is-long-enough-1234567890
      CLIENT_FINGERPRINT_SECRET: ci-only-fingerprint-secret-1234567890
      OTP_DEV_RETURN_CODE: "true"
      CORS_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements.txt -r requirements-cloud.txt
      - name: Apply migrations to a fresh PostgreSQL database
        run: alembic upgrade head
      - name: Verify migration head is current
        run: alembic current
      - name: Run backend suite against PostgreSQL
        run: pytest -q
